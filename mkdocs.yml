site_name: NPU
site_description: Unidade de Processamento Neural (NPU) — arranjo sistólico 4×4 INT8 para inferência de redes neurais, em VHDL, integrada a um SoC RISC-V.
site_url: https://RISC-V-Azedinha.github.io/NPU/
repo_name: NPU
repo_url: https://github.com/RISC-V-Azedinha/NPU
edit_uri: edit/main/docs/
copyright: Copyright &copy; RISC-V-Azedinha

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: Nesta página
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      type: datetime
      locale: pt
      fallback_to_build_date: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RISC-V-Azedinha/NPU

nav:
  - Início:
      - Introdução: index.md
      - Primeiros passos: primeiros-passos.md
  - Fundamentos: fundamentos.md
  - Arquitetura:
      - Visão geral: arquitetura/visao-geral.md
      - Núcleo de cálculo: arquitetura/nucleo.md
      - Memórias e controle: arquitetura/memorias-controle.md
      - Movimentação de dados: arquitetura/movimentacao-dados.md
  - Mapeamento de camadas: mapeamento.md
  - Software: software.md
  - Avaliação:
      - Desempenho da NPU: avaliacao/desempenho.md
      - Benchmark dos mecanismos: avaliacao/benchmark-mecanismos.md
      - "Estudo de caso: CNN para o MNIST": avaliacao/cnn-mnist.md
  - Desenvolvimento: desenvolvimento.md
  - Aplicações:
      - Conjunto Iris: aplicacoes/iris.md
      - Conjunto MNIST (MLP): aplicacoes/mnist.md
